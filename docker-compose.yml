services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qris
      POSTGRES_PASSWORD: qris
      POSTGRES_DB: qris_wallet
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qris -d qris_wallet"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
